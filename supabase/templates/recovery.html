<!doctype html><html><body style="font-family:system-ui,sans-serif;max-width:480px;margin:auto;padding:24px;color:#111">
<h2>Choose a new password</h2>
<p>Click below to set a new password for the menu admin. The link works once and expires in 1 hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/admin/set-password" style="display:inline-block;background:#111;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none">Set new password</a></p>
<p style="color:#666;font-size:13px">If you didn't ask for this, your password hasn't changed and you can ignore this email.</p>
</body></html>
